server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nama berkas di /assets/ mengandung hash isinya, jadi aman di-cache
    # selamanya. try_files =404 penting: tanpa itu berkas yang sudah tidak ada
    # (tab lama setelah deploy) dijawab index.html dengan status 200, dan
    # browser gagal mengeksekusinya sebagai modul.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html tidak boleh di-cache, supaya deploy berikutnya langsung
    # terpakai dan tidak ada tab yang tertinggal di bundle lama.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
